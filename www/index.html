<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Waste724</title>
<style>
  :root {
    --bg: #f4f8f5;
    --card-bg: #ffffff;
    --text: #16241a;
    --muted: #6c8073;
    --green: #4c9a2a;
    --green-deep: #2f7a1c;
    --orange: #e8471d;
    --orange-deep: #c23a15;
    --line: #e7efe8;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    font-family: Tahoma, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
  }

  body {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(max(22px, env(safe-area-inset-top)) + 30px) 0 34px;
    position: relative;
  }

  /* واترمارک تزئینی محو در پس‌زمینه */
  body::before {
    content: "";
    position: fixed;
    top: 38%;
    left: 50%;
    width: 340px;
    height: 340px;
    transform: translate(-50%, -50%);
    background: url("assets/logo-icon.png") center / contain no-repeat;
    opacity: 0.05;
    pointer-events: none;
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* --- هدر لوگو (قابل تغییر از پنل مدیریت) --- */
  .top-header {
    width: calc(100% - 40px);
    margin: 0 20px 14px;
    display: flex;
    align-items: center;
    gap: 9px;
    animation: rise .5s cubic-bezier(.2,.8,.2,1) both;
  }
  .top-header img { height: 26px; width: auto; display: block; }
  .top-header span { font-size: 14px; font-weight: 800; color: var(--text); }

  /* --- اسلایدر هیرو/بنر --- */
  .hero-slider {
    position: relative;
    width: calc(100% - 28px);
    margin: 0 14px;
    aspect-ratio: 1280 / 477;
    border-radius: 20px;
    overflow: hidden;
    direction: ltr;
    box-shadow: 0 14px 30px -14px rgba(20,40,25,0.28);
    animation: rise .55s cubic-bezier(.2,.8,.2,1) both;
  }
  .hero-slides {
    display: flex;
    width: 100%;
    height: 100%;
    transition: transform .55s cubic-bezier(.4,0,.2,1);
    will-change: transform;
  }
  .hero-slide {
    flex: 0 0 100%;
    width: 100%;
    height: 100%;
  }
  .hero-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .hero-dots {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    z-index: 2;
  }
  .hero-dots .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    transition: all .25s ease;
  }
  .hero-dots .dot.active {
    width: 16px;
    border-radius: 4px;
    background: #ffffff;
  }

  /* --- عنوان انتخاب --- */
  .prompt {
    font-size: 15.5px;
    font-weight: 700;
    text-align: center;
    color: var(--text);
    margin: 26px 20px 16px;
    animation: rise .55s .05s cubic-bezier(.2,.8,.2,1) both;
  }

  /* --- کارت‌های انتخاب --- */
  .options {
    width: 100%;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card-bg);
    border-radius: 22px;
    padding: 12px;
    box-shadow: 0 8px 22px -12px rgba(20,40,25,0.18);
    cursor: pointer;
    transition: transform .16s cubic-bezier(.2,.8,.2,1);
    animation: rise .55s cubic-bezier(.2,.8,.2,1) both;
  }
  .option:nth-child(2) { animation-delay: .08s; }
  .option:active { transform: scale(0.98); }

  .option .chevron {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
  }
  .option .chevron svg { width: 100%; height: 100%; }

  .option.customer .chevron {
    width: 16px;
    height: 16px;
    align-self: flex-end;
    margin-bottom: 8px;
  }

  .option .thumb {
    flex-shrink: 0;
    width: 108px;
    height: 96px;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .option.customer .thumb { background: linear-gradient(160deg, #79c24a, var(--green) 55%, var(--green-deep)); }
  .option.driver .thumb { background: linear-gradient(160deg, #f2823f, var(--orange) 55%, var(--orange-deep)); }

  .option.customer .thumb img {
    width: 118%;
    height: auto;
    object-fit: contain;
    object-position: bottom;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
  }
  .option.driver .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 45% 60%;
    mix-blend-mode: normal;
  }
  .option.driver .thumb::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(155deg, rgba(242,130,63,0.55), rgba(194,58,21,0.35) 60%, rgba(194,58,21,0.55));
  }

  .option .info { flex: 1; min-width: 0; }
  .option .title {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 16.5px;
    font-weight: 800;
    color: var(--text);
  }
  .option .badge-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .option.customer .badge-dot { background: var(--green); }
  .option.driver .badge-dot { background: var(--orange); }

  .option .desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
    margin-top: 5px;
  }

  /* --- کارت همکاری با ما (اختیاری، از پنل مدیریت) --- */
  .cooperate {
    width: 100%;
    padding: 0 20px;
    margin-top: 14px;
    display: none;
  }
  .cooperate.visible { display: block; }
  .cooperate .box {
    display: flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, #eef6ec, #e4f1e6);
    border: 1.5px dashed #a9cfa4;
    border-radius: 18px;
    padding: 14px;
    cursor: pointer;
    transition: transform .16s cubic-bezier(.2,.8,.2,1);
    animation: rise .5s cubic-bezier(.2,.8,.2,1) both;
  }
  .cooperate .box:active { transform: scale(0.98); }
  .cooperate .icon {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--green-deep);
  }
  .cooperate .icon svg { width: 22px; height: 22px; }
  .cooperate .info { flex: 1; min-width: 0; }
  .cooperate .title { font-size: 14px; font-weight: 800; color: var(--text); }
  .cooperate .desc { font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.6; }

  /* --- فوتر --- */
  .footer {
    margin-top: 30px;
    font-size: 11.5px;
    color: var(--muted);
    opacity: .8;
    animation: rise .55s .16s cubic-bezier(.2,.8,.2,1) both;
  }

  /* --- حالت لودینگ --- */
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(244,248,245,0.92);
    backdrop-filter: blur(2px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
    z-index: 10;
  }
  .loading-overlay.active { opacity: 1; pointer-events: all; }

  .spinner {
    width: 30px;
    height: 30px;
    border: 3px solid rgba(20,40,25,0.12);
    border-top-color: var(--loading-tint, var(--green));
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  .loading-overlay p { font-size: 13px; color: var(--muted); margin: 0; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

  <div class="content">

    <div class="top-header" id="topHeader">
      <img src="assets/logo-icon.png" alt="Waste724" id="headerLogo">
      <span>Waste724</span>
    </div>

    <div class="hero-slider" id="heroSlider">
      <div class="hero-slides" id="heroSlides">
        <div class="hero-slide"><img src="assets/hero-collage.jpg" alt="Waste724"></div>
      </div>
      <div class="hero-dots" id="heroDots">
        <span class="dot active"></span>
      </div>
    </div>

    <div class="prompt">لطفاً نوع کاربری خود را انتخاب کنید</div>

    <div class="options">

      <div class="option customer" onclick="go(this,'https://recycle.waste724.ir')">
        <div class="chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"></polyline></svg>
        </div>
        <div class="thumb">
          <img src="assets/family.png" alt="شهروند">
        </div>
        <div class="info">
          <div class="title"><span class="badge-dot"></span>شهروند</div>
          <div class="desc">ثبت درخواست بازیافت و پیگیری سفارش</div>
        </div>
      </div>

      <div class="option driver" onclick="go(this,'https://driver.waste724.ir')">
        <div class="chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"></polyline></svg>
        </div>
        <div class="thumb">
          <img src="assets/truck-photo.jpg" alt="راننده">
        </div>
        <div class="info">
          <div class="title"><span class="badge-dot"></span>راننده</div>
          <div class="desc">مشاهده سفارش‌ها و مسیر جمع‌آوری</div>
        </div>
      </div>

    </div>

    <div class="cooperate" id="cooperateSection">
      <div class="box" id="cooperateBox">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        </div>
        <div class="info">
          <div class="title" id="cooperateTitle">همکاری با ما</div>
          <div class="desc" id="cooperateDesc">شهرداری‌ یا کسب‌وکار هستید؟ برای همکاری با ما تماس بگیرید</div>
        </div>
      </div>
    </div>

    <div class="footer">Waste724 &middot; نسخه ۱٫۰</div>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner" id="spinner"></div>
    <p>در حال اتصال…</p>
  </div>

  <script>
    function go(el, url) {
      var isDriver = el.classList.contains('driver');
      var overlay = document.getElementById('loadingOverlay');
      var spinner = document.getElementById('spinner');
      spinner.style.setProperty('--loading-tint', isDriver ? 'var(--orange)' : 'var(--green)');
      overlay.classList.add('active');
      setTimeout(function () {
        window.location.href = url;
      }, 220);
    }

    // --- اسلایدر هیرو (خودکار) ---
    var heroSlides = document.getElementById('heroSlides');
    var heroDots = document.getElementById('heroDots');
    var slideIndex = 0;
    var slideTimer = null;

    function goToSlide(i) {
      var count = heroSlides.children.length;
      slideIndex = (i + count) % count;
      heroSlides.style.transform = 'translateX(-' + (slideIndex * 100) + '%)';
      var dots = heroDots.children;
      for (var d = 0; d < dots.length; d++) {
        dots[d].classList.toggle('active', d === slideIndex);
      }
    }

    function restartAutoplay() {
      if (slideTimer) clearInterval(slideTimer);
      if (heroSlides.children.length > 1) {
        slideTimer = setInterval(function () {
          goToSlide(slideIndex + 1);
        }, 4200);
      }
    }

    function addHeroSlide(url, linkUrl) {
      var slide = document.createElement('div');
      slide.className = 'hero-slide';
      var img = document.createElement('img');
      img.alt = 'Waste724';
      img.onload = function () {
        var dot = document.createElement('span');
        dot.className = 'dot';
        heroDots.appendChild(dot);
        restartAutoplay();
      };
      img.src = url;
      slide.appendChild(img);
      if (linkUrl) {
        slide.style.cursor = 'pointer';
        slide.onclick = function () { window.location.href = linkUrl; };
      }
      heroSlides.appendChild(slide);
    }

    restartAutoplay();

    // --- بنر مدیریت‌شده از گیت‌هاب (بدون نیاز به ساخت مجدد اپ) ---
    // برای افزودن اسلاید تبلیغاتی/اطلاع‌رسانی به همین اسلایدر بالای صفحه،
    // کافیست در ریپوی گیت‌هاب فایل banner-config.json را ویرایش کنید:
    // "enabled": true و "imageUrl" را به آدرس تصویر جدید (مثلاً همان banner.jpg)
    // تنظیم کنید. اگر غیرفعال یا در دسترس نبود، این بخش بی‌صدا نادیده گرفته می‌شود
    // و فقط همان اسلاید اصلی نمایش داده می‌شود.
    (function loadBanner() {
      var CONFIG_URL =
        'https://raw.githubusercontent.com/waste724ir-sketch/waste724-app/main/banner-config.json?t=' +
        Date.now(); // پارامتر t فقط برای دور زدن کش مرورگر/CDN است

      fetch(CONFIG_URL, { cache: 'no-store' })
        .then(function (res) {
          if (!res.ok) throw new Error('config not found');
          return res.json();
        })
        .then(function (cfg) {
          if (!cfg) return;

          // --- افزودن بنر(ها) به اسلایدر ---
          if (Array.isArray(cfg.banners)) {
            cfg.banners.forEach(function (b) {
              if (b && b.imageUrl) {
                var u = b.imageUrl + (b.imageUrl.indexOf('?') === -1 ? '?t=' : '&t=') + Date.now();
                addHeroSlide(u, b.linkUrl);
              }
            });
          } else if (cfg.enabled === true && cfg.imageUrl) {
            // سازگاری با نسخه‌ی قدیمی (تک‌بنر)
            var url = cfg.imageUrl + (cfg.imageUrl.indexOf('?') === -1 ? '?t=' : '&t=') + Date.now();
            addHeroSlide(url, cfg.linkUrl);
          }

          // --- لوگوی هدر ---
          if (cfg.logoEnabled === true && cfg.logoUrl) {
            var logoUrl = cfg.logoUrl + (cfg.logoUrl.indexOf('?') === -1 ? '?t=' : '&t=') + Date.now();
            document.getElementById('headerLogo').src = logoUrl;
          }
          if (cfg.headerVisible === false) {
            document.getElementById('topHeader').style.display = 'none';
          }

          // --- بخش همکاری با ما ---
          if (cfg.cooperate && cfg.cooperate.enabled === true) {
            var sec = document.getElementById('cooperateSection');
            if (cfg.cooperate.title) document.getElementById('cooperateTitle').textContent = cfg.cooperate.title;
            if (cfg.cooperate.desc) document.getElementById('cooperateDesc').textContent = cfg.cooperate.desc;
            sec.classList.add('visible');
            if (cfg.cooperate.link) {
              document.getElementById('cooperateBox').onclick = function () {
                window.location.href = cfg.cooperate.link;
              };
            }
          }

          // --- پس‌زمینه‌ی کل صفحه (اختیاری) ---
          if (cfg.backgroundEnabled === true && cfg.backgroundImageUrl) {
            var bgUrl = cfg.backgroundImageUrl +
              (cfg.backgroundImageUrl.indexOf('?') === -1 ? '?t=' : '&t=') + Date.now();
            var preload = new Image();
            preload.onload = function () {
              document.body.style.backgroundImage =
                'linear-gradient(rgba(244,248,245,0.85), rgba(244,248,245,0.92)), url("' + bgUrl + '")';
              document.body.style.backgroundSize = 'cover';
              document.body.style.backgroundPosition = 'center';
              document.body.style.backgroundRepeat = 'no-repeat';
            };
            preload.src = bgUrl;
          }
        })
        .catch(function () {
          // بی‌سروصدا نادیده گرفته می‌شود؛ نبود بنر/پس‌زمینه نباید در کارکرد اپ اختلال ایجاد کند
        });
    })();
  </script>

</body>
</html>
