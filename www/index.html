<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Waste724</title>

<!-- Google Analytics (GA4) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KX3V28FZVE"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-KX3V28FZVE');
</script>

<style>
  :root {
    --bg-1: #08170c;
    --bg-2: #0d2211;
    --text: #f3faf6;
    --muted: #9fb8a6;
    --green: #59b139;
    --green-deep: #1c3e1d;
    --orange: #e8471d;
    --orange-deep: #a5320f;
    --blue: #3b82f6;
    --blue-deep: #1d4ed8;
    --surface: rgba(255,255,255,0.05);
    --surface-border: rgba(255,255,255,0.08);
    --divider: rgba(255,255,255,0.08);
  }

  body.light-theme {
    --text: #16321d;
    --muted: #4d6355;
    --surface: rgba(255,255,255,0.55);
    --surface-border: rgba(0,0,0,0.06);
    --divider: rgba(0,0,0,0.07);
  }
  body.light-theme .footer { opacity: .55; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    font-family: Tahoma, "Segoe UI", sans-serif;
    background: var(--bg-1);
    color: var(--text);
    overflow-x: hidden;
  }

  body {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px 28px;
    position: relative;
    background:
      radial-gradient(760px 420px at 50% -10%, rgba(89,177,57,0.16), transparent 60%),
      radial-gradient(620px 380px at 100% 110%, rgba(232,71,29,0.10), transparent 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
  }

  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 22px 22px;
    pointer-events: none;
  }

  .content {
    position: relative;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* --- لوگو مستقیم روی پس‌زمینه (بدون بج/دایره) --- */
  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 28px;
    animation: rise .55s cubic-bezier(.2,.8,.2,1) both;
  }
  .brand-logo {
    width: 58px;
    height: 58px;
    object-fit: contain;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.35));
    margin-bottom: 12px;
  }
  .brand-title { font-size: 20px; font-weight: 800; }
  .brand-title .accent { color: var(--green); }
  .brand-subtitle { font-size: 12.5px; color: var(--muted); margin-top: 5px; }

  /* --- کارت یکپارچه‌ی انتخاب --- */
  .options {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 22px;
    overflow: hidden;
    backdrop-filter: blur(6px);
    animation: rise .55s .06s cubic-bezier(.2,.8,.2,1) both;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px;
    cursor: pointer;
    transition: background .15s ease;
  }
  .option:active { background: rgba(255,255,255,0.06); }
  body.light-theme .option:active { background: rgba(0,0,0,0.04); }

  .option + .option {
    border-top: 1px solid var(--divider);
  }

  .icon-tile {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-tile svg { width: 22px; height: 22px; }

  .option.customer .icon-tile { background: linear-gradient(150deg, var(--green), var(--green-deep)); }
  .option.driver .icon-tile { background: linear-gradient(150deg, var(--orange), var(--orange-deep)); }
  .option.ops .icon-tile { background: linear-gradient(150deg, var(--blue), var(--blue-deep)); }

  .option-body { flex: 1; min-width: 0; }
  .option-body h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 800;
  }
  .option-body p {
    margin: 2px 0 0;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.6;
  }

  .chevron {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    opacity: .5;
    transition: transform .18s ease;
  }
  .option:active .chevron { transform: translateX(-3px); }

  /* --- بنر (اسلایدشو) --- */
  #bannerWrap {
    display: none;
    width: 100%;
    margin-bottom: 20px;
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 24px -10px rgba(0,0,0,0.5);
  }
  #bannerSlides { position: relative; width: 100%; aspect-ratio: 1280/692; }

  /* --- همکاران --- */
  #partnersWrap { display: none; width: 100%; margin-top: 26px; text-align: center; }
  #partnersLabel { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  #partnersRow {
    background: #fff;
    border-radius: 16px;
    padding: 14px 20px;
    display: inline-flex;
    align-items: center;
    gap: 20px;
    box-shadow: 0 6px 18px -8px rgba(0,0,0,0.35);
  }

  /* --- فوتر --- */
  .footer {
    margin-top: 22px;
    font-size: 11.5px;
    color: var(--muted);
    opacity: .7;
    animation: rise .55s .16s cubic-bezier(.2,.8,.2,1) both;
  }

  /* --- حالت لودینگ --- */
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(8,23,12,0.88);
    backdrop-filter: blur(2px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
    z-index: 10;
  }
  .loading-overlay.active { opacity: 1; pointer-events: all; }

  .spinner {
    width: 30px;
    height: 30px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: var(--loading-tint, var(--green));
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  .loading-overlay p { font-size: 13px; color: var(--muted); margin: 0; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

  <div class="content">

    <div id="bannerWrap">
      <div id="bannerSlides"></div>
    </div>

    <div class="brand">
      <img id="logoImg" class="brand-logo" src="assets/logo-icon.png" alt="Waste724">
      <div class="brand-title" id="brandTitle">Waste<span class="accent">724</span></div>
      <div class="brand-subtitle" id="brandSubtitle">لطفاً نوع کاربری خود را انتخاب کنید</div>
    </div>

    <div class="options">

      <div class="option customer" onclick="go(this,'https://recycle.waste724.ir')">
        <div class="icon-tile">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 21C7.5 21 4 17.5 4 13c0-3.5 2-5.5 3.5-7" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M12 3c4.5 0 8 3.5 8 8 0 1.4-.3 2.6-.9 3.7" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M15.5 5.2L12 3l.8 3.8" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8.5 18.8L12 21l-.8-3.8" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="2" fill="white"/>
          </svg>
        </div>
        <div class="option-body">
          <h2 id="optionLabel">شهروند</h2>
          <p id="optionCaption">ثبت درخواست بازیافت و پیگیری سفارش</p>
        </div>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="option driver" onclick="go(this,'https://driver.waste724.ir')">
        <div class="icon-tile">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="8" width="11" height="7" rx="1.2" fill="white"/>
            <path d="M13 10.5h4.2l3.3 3v1.5H13v-4.5Z" fill="white" opacity="0.9"/>
            <circle cx="7" cy="17.2" r="1.9" fill="var(--orange-deep)" stroke="white" stroke-width="1.6"/>
            <circle cx="17.2" cy="17.2" r="1.9" fill="var(--orange-deep)" stroke="white" stroke-width="1.6"/>
          </svg>
        </div>
        <div class="option-body">
          <h2 id="driverLabel">راننده</h2>
          <p id="driverCaption">مشاهده سفارش‌ها و مسیر جمع‌آوری</p>
        </div>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

    </div>

    <div id="partnersWrap">
      <div id="partnersLabel">مورد اعتماد و همکاری با</div>
      <div id="partnersRow"></div>
    </div>

    <div class="footer" id="footerText">Waste724 &middot; نسخه ۱٫۳</div>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner" id="spinner"></div>
    <p>در حال اتصال…</p>
  </div>

  <script>
    function go(el, url) {
      var tint = 'var(--green)';
      if (el.classList.contains('driver')) tint = 'var(--orange)';
      else if (el.classList.contains('ops')) tint = 'var(--blue)';

      if (typeof gtag === 'function') {
        gtag('event', 'select_role', { role: el.className.replace('option ', '') });
      }

      var overlay = document.getElementById('loadingOverlay');
      var spinner = document.getElementById('spinner');
      spinner.style.setProperty('--loading-tint', tint);
      overlay.classList.add('active');
      setTimeout(function () {
        window.location.href = url;
      }, 220);
    }

    // --- بنر / پس‌زمینه / سفارشی‌سازی ظاهر / همکاران، قابل مدیریت از گیت‌هاب ---
    (function loadRemoteConfig() {
      var CONFIG_URL =
        'https://raw.githubusercontent.com/waste724ir-sketch/waste724-app/main/banner-config.json?t=' +
        Date.now();

      fetch(CONFIG_URL, { cache: 'no-store' })
        .then(function (res) {
          if (!res.ok) throw new Error('config not found');
          return res.json();
        })
        .then(function (cfg) {
          if (!cfg) return;

          if (cfg.app) {
            var a = cfg.app;
            if (a.logoUrl) {
              document.getElementById('logoImg').src = a.logoUrl + (a.logoUrl.indexOf('?') === -1 ? '?t=' : '&t=') + Date.now();
            }
            if (a.primaryColor) {
              document.documentElement.style.setProperty('--green', a.primaryColor);
            }
            if (a.primaryColorDeep) {
              document.documentElement.style.setProperty('--green-deep', a.primaryColorDeep);
            }
            if (a.brandTitle) {
              document.getElementById('brandTitle').textContent = a.brandTitle;
            }
            if (a.brandSubtitle) {
              document.getElementById('brandSubtitle').textContent = a.brandSubtitle;
            }
            if (a.optionLabel) {
              document.getElementById('optionLabel').textContent = a.optionLabel;
            }
            if (a.optionCaption) {
              document.getElementById('optionCaption').textContent = a.optionCaption;
            }
            if (a.driverLabel) {
              document.getElementById('driverLabel').textContent = a.driverLabel;
            }
            if (a.driverCaption) {
              document.getElementById('driverCaption').textContent = a.driverCaption;
            }
            if (a.footerText) {
              document.getElementById('footerText').textContent = a.footerText;
            }
          }

          if (cfg.partnersEnabled === true && Array.isArray(cfg.partners) && cfg.partners.length > 0) {
            var partnersRow = document.getElementById('partnersRow');
            cfg.partners.forEach(function (p) {
              if (!p || !p.imageUrl) return;
              var pImg = document.createElement('img');
              pImg.src = p.imageUrl + (p.imageUrl.indexOf('?') === -1 ? '?t=' : '&t=') + Date.now();
              pImg.alt = p.name || '';
              pImg.style.cssText = 'height:40px;max-width:110px;object-fit:contain;';
              partnersRow.appendChild(pImg);
            });
            if (partnersRow.children.length > 0) {
              if (cfg.partnersLabel) {
                document.getElementById('partnersLabel').textContent = cfg.partnersLabel;
              }
              document.getElementById('partnersWrap').style.display = 'block';
            }
          }

          var slides = [];
          if (Array.isArray(cfg.banners) && cfg.banners.length > 0) {
            slides = cfg.banners.filter(function (s) { return s && s.imageUrl; });
          } else if (cfg.enabled === true && cfg.imageUrl) {
            slides = [{ imageUrl: cfg.imageUrl, linkUrl: cfg.linkUrl || '' }];
          }

          if (slides.length > 0) {
            var wrap = document.getElementById('bannerWrap');
            var slidesContainer = document.getElementById('bannerSlides');
            var cacheBust = Date.now();

            slides.forEach(function (slide, i) {
              var img = document.createElement('img');
              img.src = slide.imageUrl + (slide.imageUrl.indexOf('?') === -1 ? '?t=' : '&t=') + cacheBust;
              img.alt = cfg.alt || 'بنر';
              img.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:' + (i === 0 ? '1' : '0') + ';transition:opacity .6s ease;';
              if (slide.linkUrl) {
                img.style.cursor = 'pointer';
                img.onclick = function () { window.location.href = slide.linkUrl; };
              }
              slidesContainer.appendChild(img);
            });

            wrap.style.display = 'block';

            if (slides.length > 1) {
              var current = 0;
              var imgs = slidesContainer.querySelectorAll('img');
              setInterval(function () {
                imgs[current].style.opacity = '0';
                current = (current + 1) % imgs.length;
                imgs[current].style.opacity = '1';
              }, 4000);
            }
          }

          if (cfg.backgroundEnabled === true && cfg.backgroundImageUrl) {
            var bgUrl = cfg.backgroundImageUrl +
              (cfg.backgroundImageUrl.indexOf('?') === -1 ? '?t=' : '&t=') + Date.now();
            var isLight = cfg.backgroundTheme === 'light';
            var preload = new Image();
            preload.onload = function () {
              var overlay = isLight
                ? 'linear-gradient(rgba(255,255,255,0.62), rgba(255,255,255,0.7))'
                : 'linear-gradient(rgba(8,23,12,0.72), rgba(8,23,12,0.82))';
              document.body.style.backgroundImage = overlay + ', url("' + bgUrl + '")';
              document.body.style.backgroundSize = 'cover';
              document.body.style.backgroundPosition = 'center';
              document.body.style.backgroundRepeat = 'no-repeat';
              if (isLight) {
                document.body.classList.add('light-theme');
              }
            };
            preload.src = bgUrl;
          }
        })
        .catch(function () {
          // بی‌سروصدا نادیده گرفته می‌شود
        });
    })();
  </script>

</body>
</html>
